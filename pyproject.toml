[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turret-vision"
version = "0.1.0"
description = "Object localization for a laser-pointing turret. Grok reads the scene; a local detector tightens boxes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.52.0",
  "python-dotenv>=1.0.1",
  "pydantic>=2.7",
  "PyYAML>=6.0.1",
  "Pillow>=10.3",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[tool.setuptools.packages.find]
include = ["vision*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
